<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香蕉黄油拿铁 · 摄影作品</title>
  <meta name="description" content="香蕉黄油拿铁的个人摄影作品集：记录光影 · 山川与日常">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 顶部导航（常驻，不隐藏） -->
  <nav class="nav" id="nav">
    <a class="nav-brand" href="index.html">Banana Butter Latte</a>
    <button class="nav-toggle" id="navToggle" aria-label="菜单">
      <span></span><span></span><span></span>
    </button>
    <div class="nav-links" id="navLinks">
      <a href="index.html" class="active">首页</a>
      <a href="motion.html">作品集</a>
      <a href="about.html">关于我</a>
      <a href="contact.html">联系</a>
    </div>
  </nav>

  <!-- Hero 两阶段：
       阶段一：纯黑背景 + 居中白色名字（呼吸明暗闪动），点击可跳过等待
       阶段二：全屏背景图（heroBg，可配置替换）+ 名字缩小移至左上角，不遮挡图片 -->
  <header class="hero" id="hero">

    <!-- 阶段二背景层（默认透明，过渡时淡入 + 轻微推近） -->
    <div class="hero-bg" id="heroBg"></div>

    <!-- 阶段一文字层（居中，呼吸闪动） -->
    <div class="hero-text" id="heroText">
      <p class="hero-en" id="heroEn">Banana Butter Latte</p>
      <h1 class="hero-name" id="heroName">香蕉黄油拿铁</h1>
      <p class="hero-tagline" id="heroTagline">记录光影 · 山川与日常</p>
    </div>

    <!-- 阶段二角落名字（过渡后缩小移至左上角，不遮挡图片） -->
    <div class="hero-mini" id="heroMini">香蕉黄油拿铁</div>

    <!-- 阶段一提示 -->
    <div class="hero-hint" id="heroHint">点击进入</div>
  </header>

  <!-- 页脚 -->
  <footer class="footer">
    <p class="foot-en">Banana Butter Latte</p>
    <p class="foot-copy" id="year"></p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
